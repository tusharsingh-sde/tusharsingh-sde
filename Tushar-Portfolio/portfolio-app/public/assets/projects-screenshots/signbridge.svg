<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0a0a0b"/>
  <rect x="50" y="50" width="700" height="350" rx="12" fill="#131315" stroke="#27272a" stroke-width="2"/>

  <!-- Header -->
  <rect x="50" y="50" width="700" height="40" rx="12" fill="#1a1a1d"/>
  <circle cx="75" cy="70" r="6" fill="#ef4444"/>
  <circle cx="95" cy="70" r="6" fill="#fbbf24"/>
  <circle cx="115" cy="70" r="6" fill="#22c55e"/>
  <text x="400" y="75" text-anchor="middle" fill="#a1a1aa" font-family="system-ui" font-size="14">SignBridge — ISL Translation Platform</text>

  <!-- Video feed -->
  <rect x="70" y="110" width="320" height="240" rx="8" fill="#0f0f10" stroke="#27272a"/>
  <text x="230" y="135" text-anchor="middle" fill="#fafaf9" font-family="system-ui" font-size="12" font-weight="600">📹 Sign Language Input</text>

  <!-- Hand landmarks visualization -->
  <circle cx="200" cy="220" r="40" fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="4"/>
  <circle cx="180" cy="200" r="5" fill="#14b8a6"/>
  <circle cx="220" cy="200" r="5" fill="#14b8a6"/>
  <circle cx="200" cy="180" r="5" fill="#14b8a6"/>
  <circle cx="160" cy="230" r="5" fill="#14b8a6"/>
  <circle cx="240" cy="230" r="5" fill="#14b8a6"/>
  <line x1="180" y1="200" x2="220" y2="200" stroke="#14b8a6" stroke-width="2"/>
  <line x1="200" y1="180" x2="200" y2="220" stroke="#14b8a6" stroke-width="2"/>
  <text x="230" y="300" text-anchor="middle" fill="#fbbf24" font-family="system-ui" font-size="11">⏳ Processing gesture...</text>

  <!-- Translation output -->
  <rect x="410" y="110" width="320" height="240" rx="8" fill="#0f0f10" stroke="#27272a"/>
  <text x="570" y="135" text-anchor="middle" fill="#fafaf9" font-family="system-ui" font-size="12" font-weight="600">💬 Translation</text>

  <rect x="430" y="160" width="280" height="60" rx="6" fill="#1a1a1d"/>
  <text x="450" y="185" fill="#14b8a6" font-family="system-ui" font-size="14" font-weight="600">"Hello, how are you?"</text>
  <text x="450" y="205" fill="#71717a" font-family="system-ui" font-size="10">English translation</text>

  <rect x="430" y="240" width="280" height="60" rx="6" fill="#1a1a1d"/>
  <text x="450" y="265" fill="#a1a1aa" font-family="system-ui" font-size="14">"नमस्ते, आप कैसे हैं?"</text>
  <text x="450" y="285" fill="#71717a" font-family="system-ui" font-size="10">Hindi translation</text>

  <!-- Status -->
  <rect x="410" y="370" width="320" height="20" rx="4" fill="#131315"/>
  <text x="570" y="384" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="10">● Live • MediaPipe • Real-time ISL</text>

  <!-- Footer -->
  <text x="230" y="400" text-anchor="middle" fill="#71717a" font-family="system-ui" font-size="10">🚧 In Development — ISL to English/Hindi</text>
</svg>