<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0a0a0b"/>
  <rect x="50" y="50" width="700" height="350" rx="12" fill="#131315" stroke="#27272a" stroke-width="2"/>

  <!-- Header -->
  <rect x="50" y="50" width="700" height="40" rx="12" fill="#1a1a1d"/>
  <circle cx="75" cy="70" r="6" fill="#ef4444"/>
  <circle cx="95" cy="70" r="6" fill="#fbbf24"/>
  <circle cx="115" cy="70" r="6" fill="#22c55e"/>
  <text x="400" y="75" text-anchor="middle" fill="#a1a1aa" font-family="system-ui" font-size="14">CloudMask — Satellite Cloud Segmentation</text>

  <!-- Input image -->
  <rect x="70" y="110" width="300" height="200" rx="8" fill="#0f0f10" stroke="#27272a"/>
  <text x="220" y="135" text-anchor="middle" fill="#fafaf9" font-family="system-ui" font-size="12" font-weight="600">Input: Sentinel-2</text>

  <!-- Simulated satellite image with clouds -->
  <rect x="90" y="150" width="260" height="140" rx="4" fill="#1a3a5c"/>
  <ellipse cx="180" cy="200" rx="80" ry="40" fill="#e8e8e8" opacity="0.9"/>
  <ellipse cx="250" cy="240" rx="60" ry="30" fill="#d0d0d0" opacity="0.8"/>
  <ellipse cx="130" cy="260" rx="50" ry="25" fill="#f0f0f0" opacity="0.85"/>

  <!-- Arrow -->
  <path d="M390 210 L430 210" stroke="#14b8a6" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#14b8a6"/>
    </marker>
  </defs>

  <!-- Output mask -->
  <rect x="450" y="110" width="300" height="200" rx="8" fill="#0f0f10" stroke="#27272a"/>
  <text x="600" y="135" text-anchor="middle" fill="#fafaf9" font-family="system-ui" font-size="12" font-weight="600">Output: Cloud Mask</text>

  <!-- Segmented clouds -->
  <rect x="470" y="150" width="260" height="140" rx="4" fill="#0a0a0b"/>
  <ellipse cx="560" cy="200" rx="80" ry="40" fill="#14b8a6" opacity="0.9"/>
  <ellipse cx="630" cy="240" rx="60" ry="30" fill="#22c55e" opacity="0.8"/>
  <ellipse cx="510" cy="260" rx="50" ry="25" fill="#f97316" opacity="0.85"/>

  <!-- Legend -->
  <rect x="470" y="330" width="280" height="50" rx="6" fill="#131315"/>
  <circle cx="490" cy="355" r="6" fill="#14b8a6"/>
  <text x="505" y="359" fill="#a1a1aa" font-family="system-ui" font-size="10">Thick cloud</text>
  <circle cx="580" cy="355" r="6" fill="#22c55e"/>
  <text x="595" y="359" fill="#a1a1aa" font-family="system-ui" font-size="10">Thin cloud</text>
  <circle cx="665" cy="355" r="6" fill="#f97316"/>
  <text x="680" y="359" fill="#a1a1aa" font-family="system-ui" font-size="10">Shadow</text>

  <!-- Metrics -->
  <rect x="70" y="330" width="300" height="50" rx="6" fill="#131315"/>
  <text x="90" y="355" fill="#14b8a6" font-family="monospace" font-size="11">IoU: 0.923  |  F1: 0.947  |  Time: 47ms</text>
</svg>