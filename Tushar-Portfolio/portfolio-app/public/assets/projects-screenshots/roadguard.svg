<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0a0a0b"/>
  <rect x="50" y="50" width="700" height="350" rx="12" fill="#131315" stroke="#27272a" stroke-width="2"/>

  <!-- Header -->
  <rect x="50" y="50" width="700" height="40" rx="12" fill="#1a1a1d"/>
  <circle cx="75" cy="70" r="6" fill="#ef4444"/>
  <circle cx="95" cy="70" r="6" fill="#fbbf24"/>
  <circle cx="115" cy="70" r="6" fill="#22c55e"/>
  <text x="400" y="75" text-anchor="middle" fill="#a1a1aa" font-family="system-ui" font-size="14">RoadGuard — Pothole Detection Dashboard</text>

  <!-- Camera feed -->
  <rect x="70" y="110" width="380" height="270" rx="8" fill="#0f0f10" stroke="#3f3f46"/>
  <text x="260" y="180" text-anchor="middle" fill="#71717a" font-family="system-ui" font-size="12">📹 Live Camera Feed</text>

  <!-- Detection boxes -->
  <rect x="150" y="200" width="80" height="60" rx="4" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="190" y="195" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="10">Pothole 92%</text>

  <rect x="280" y="220" width="100" height="70" rx="4" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <text x="330" y="215" text-anchor="middle" fill="#fbbf24" font-family="system-ui" font-size="10">Crack 78%</text>

  <!-- Stats panel -->
  <rect x="470" y="110" width="260" height="120" rx="8" fill="#0f0f10" stroke="#27272a"/>
  <text x="490" y="140" fill="#fafaf9" font-family="system-ui" font-size="14" font-weight="600">Detection Stats</text>
  <text x="490" y="170" fill="#22c55e" font-family="system-ui" font-size="12">✓ Potholes: 23</text>
  <text x="490" y="195" fill="#fbbf24" font-family="system-ui" font-size="12">⚠ Cracks: 45</text>
  <text x="490" y="220" fill="#ef4444" font-family="system-ui" font-size="12">✗ Critical: 3</text>

  <!-- Location info -->
  <rect x="470" y="245" width="260" height="135" rx="8" fill="#0f0f10" stroke="#27272a"/>
  <text x="490" y="275" fill="#fafaf9" font-family="system-ui" font-size="14" font-weight="600">📍 Location Data</text>
  <text x="490" y="305" fill="#a1a1aa" font-family="system-ui" font-size="11">GPS: 28.6139° N, 77.2090° E</text>
  <text x="490" y="325" fill="#a1a1aa" font-family="system-ui" font-size="11">Road: NH-48, Delhi</text>
  <text x="490" y="345" fill="#a1a1aa" font-family="system-ui" font-size="11">Timestamp: 2026-10-26 14:32</text>
  <rect x="490" y="355" width="100" height="20" rx="4" fill="#14b8a6"/>
  <text x="540" y="369" text-anchor="middle" fill="#051d1b" font-family="system-ui" font-size="11" font-weight="600">Report</text>
</svg>